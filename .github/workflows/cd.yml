name: CD

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      ECR_REPO: ${{ secrets.ECR_REPO }}          # cloud-portfolio
      ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}    # cloud-portfolio
      ECS_SERVICE: ${{ secrets.ECS_SERVICE }}    # cloud-portfolio
      IMAGE_TAG: sha-${{ github.sha }}
      ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image (from docker/app/Dockerfile)
        run: |
          docker build -f docker/app/Dockerfile -t $ECR_REPO:latest -t $ECR_REPO:$IMAGE_TAG .

      - name: Tag & Push to ECR
        run: |
          docker tag $ECR_REPO:latest $ECR_REGISTRY/$ECR_REPO:latest
          docker tag $ECR_REPO:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPO:latest
          docker push $ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG

      - name: Force new deployment in ECS
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment \
            --region "$AWS_REGION"
            
      - name: Run DB migrations in ECS
        run: |
          SUBNETS=$(aws ec2 describe-subnets --filters Name=default-for-az,Values=true --region "$AWS_REGION" --query 'Subnets[].SubnetId' --output text)
          SG_ID=$(aws ec2 describe-security-groups --filters Name=group-name,Values=ecs-cloud-portfolio-sg --region "$AWS_REGION" --query 'SecurityGroups[0].GroupId' --output text)

          aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG_ID],assignPublicIp=ENABLED}" \
            --task-definition "$ECS_SERVICE" \
            --overrides "{\"containerOverrides\":[{\"name\":\"webapp\",\"command\":[\"php\",\"artisan\",\"migrate\",\"--force\"]}]}" \
            --region "$AWS_REGION"
